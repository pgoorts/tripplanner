<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Outfit', system-ui, -apple-system, sans-serif; }
    a, a:hover { color: #1ABC9C; }
  </style>
</helmet>

<div style="width:375px;height:812px;background:#0D1526;color:#E8EDF5;border:1px solid #162440;border-radius:10px;overflow:hidden;position:relative;">

  <!-- Trip Top Bar (gradient) -->
  <div style="background:linear-gradient(180deg,#111E33,#0D1526);padding-bottom:12px;">
    <div style="display:flex;align-items:center;padding:4px 8px;">
      <div style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#ABB7CC;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </div>
      <div style="flex:1;font-size:22px;line-height:28px;font-weight:700;color:#FFFFFF;">Japan</div>
      <div style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#ABB7CC;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
      </div>
      <div style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#ABB7CC;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 21h14a2 2 0 0 0 2-2v-6"/><path d="M3 12v7a2 2 0 0 0 2 2"/></svg>
      </div>
    </div>
    <div style="display:flex;align-items:center;padding:0 20px;gap:6px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1ABC9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <div style="font-size:12px;color:#ABB7CC;">Jun 1 &ndash; Jun 10, 2026</div>
      <div style="background:rgba(26,188,156,0.15);color:#48C9B0;font-size:11px;border-radius:20px;padding:2px 8px;margin-left:4px;">10 days</div>
    </div>
  </div>

  <!-- NEW: Sync Status Bar -->
  <div style="display:flex;align-items:center;gap:8px;padding:8px 16px;background:#111E33;border-bottom:1px solid #162440;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1ABC9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.5 6.36"/><path d="M3 12a9 9 0 0 1 15.5-6.36"/><path d="M21 3v6h-6"/><path d="M3 21v-6h6"/></svg>
    <div style="flex:1;font-size:12px;color:#ABB7CC;">Synced 4 minutes ago</div>
    <div style="width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#1ABC9C;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.5 6.36"/><path d="M3 12a9 9 0 0 1 15.5-6.36"/><path d="M21 3v6h-6"/><path d="M3 21v-6h6"/></svg>
    </div>
  </div>

  <!-- Tab row -->
  <div style="display:flex;gap:8px;padding:8px 16px;background:#0D1526;">
    <div style="flex:1;text-align:center;padding:8px 4px;border-radius:20px;background:#1ABC9C;font-size:12px;font-weight:600;color:#080E1A;">Itinerary</div>
    <div style="flex:1;text-align:center;padding:8px 4px;border-radius:20px;background:#162440;font-size:12px;color:#ABB7CC;">Notes</div>
    <div style="flex:1;text-align:center;padding:8px 4px;border-radius:20px;background:#162440;font-size:12px;color:#ABB7CC;">Reminders</div>
  </div>

  <!-- Day header -->
  <div style="display:flex;align-items:center;gap:8px;padding:6px 16px;">
    <div style="width:8px;height:8px;border-radius:4px;background:#1ABC9C;"></div>
    <div style="font-size:14px;font-weight:700;color:#1ABC9C;">Mon, Jun 1</div>
    <div style="background:rgba(26,188,156,0.15);color:#1ABC9C;font-size:11px;border-radius:20px;padding:2px 6px;">Today</div>
    <div style="flex:1;"></div>
    <div style="width:80px;height:1px;background:rgba(58,74,98,0.4);"></div>
  </div>

  <!-- Event cards -->
  <div style="display:flex;padding:3px 16px;">
    <div style="width:36px;height:36px;border-radius:18px;background:rgba(41,128,185,0.15);border:1px solid rgba(41,128,185,0.4);display:flex;align-items:center;justify-content:center;color:#2980B9;flex-shrink:0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
    </div>
    <div style="width:10px;"></div>
    <div style="flex:1;background:#162440;border-radius:12px;padding:10px 12px;">
      <div style="font-size:14px;font-weight:600;color:#FFFFFF;">Flight to Tokyo</div>
      <div style="display:flex;align-items:center;gap:4px;margin-top:3px;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#667799" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <div style="font-size:12px;color:#667799;">11:20</div>
      </div>
      <div style="margin-top:6px;background:rgba(41,128,185,0.12);display:inline-block;border-radius:20px;padding:2px 8px;font-size:11px;color:#2980B9;">Flight</div>
    </div>
    <div style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#3A4A62;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
    </div>
  </div>

  <div style="display:flex;padding:3px 16px;margin-top:4px;">
    <div style="width:36px;height:36px;border-radius:18px;background:rgba(142,68,173,0.15);border:1px solid rgba(142,68,173,0.4);display:flex;align-items:center;justify-content:center;color:#8E44AD;flex-shrink:0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20v-8a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v8"/><path d="M14 20v-4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v4"/><path d="M2 20h20"/><circle cx="6" cy="8" r="2"/></svg>
    </div>
    <div style="width:10px;"></div>
    <div style="flex:1;background:#162440;border-radius:12px;padding:10px 12px;">
      <div style="font-size:14px;font-weight:600;color:#FFFFFF;">Shinjuku Grand Hotel</div>
      <div style="font-size:12px;color:#667799;margin-top:3px;">All day</div>
      <div style="margin-top:6px;background:rgba(142,68,173,0.12);display:inline-block;border-radius:20px;padding:2px 8px;font-size:11px;color:#8E44AD;">Lodging</div>
    </div>
    <div style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#3A4A62;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
    </div>
  </div>

  <!-- Dim overlay + delete confirmation dialog -->
  <div style="position:absolute;inset:0;background:rgba(8,14,26,0.7);display:flex;align-items:center;justify-content:center;padding:24px;">
    <div style="width:100%;background:#111E33;border-radius:20px;padding:22px 20px;">
      <div style="font-size:18px;line-height:24px;font-weight:700;color:#FFFFFF;">Delete event?</div>
      <div style="height:10px;"></div>
      <div style="font-size:13px;line-height:19px;color:#ABB7CC;">"Flight to Tokyo" will be permanently removed from this trip. This can't be undone.</div>
      <div style="height:18px;"></div>
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <div style="padding:9px 14px;font-size:13px;font-weight:600;color:#ABB7CC;">Cancel</div>
        <div style="padding:9px 16px;border-radius:8px;background:#E74C3C;font-size:13px;font-weight:600;color:#FFFFFF;">Delete</div>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
